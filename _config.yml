# ----- SITE SETTINGS -----
locale:                  "en-US"
title:                   "Matthis Lahargoue — ML Engineer"
title_separator:         "|"
name:                    "Matthis Lahargoue"
description:             "Applied Machine Learning Engineer focused on real-world constraints, reproducibility, and data-driven rigor."
url:                     "https://matla91.github.io"
baseurl:                 ""
repository:              "matla91/matla91.github.io"

# ----- SITE AUTHOR -----
author:
  name:        "Matthis Lahargoue"
  avatar:      "profile.png"
  bio:         "ML Engineer · Computer Vision · Large-Scale ML · Reproducibility. I build models that work under real constraints — not just on leaderboards."
  location:    "Chicoutimi, QC, Canada"
  employer:
  uri:
  email:       "matthis.lahargoue@gmail.com"
  github:      "matla91"
  linkedin:    "matthis-lahargoue"
  # Uncomment and fill in if relevant:
  # googlescholar:
  # orcid:
  # kaggle:

# ----- READING -----
words_per_minute:        200

# ----- OUTPUTTING -----
permalink:               /:categories/:title/
timezone:                America/Toronto

# ----- NAVIGATION -----
# Only show sections that matter for an ML engineer portfolio.
# Teaching, Talks, and Publications are disabled unless you add content later.
header_pages:
  - _pages/about.md
  - _pages/cv.md
  - _pages/portfolio.md
  # - _pages/publications.md    # Enable when you have publications
  # - _pages/talks.md           # Enable when you have talks
  # - _pages/teaching.md        # Not relevant for ML engineer positioning

# ----- COLLECTIONS -----
collections:
  portfolio:
    output:    true
    permalink: /:collection/:path/

# ----- DEFAULTS -----
defaults:
  # _pages
  - scope:
      path:   "_pages"
      type:   pages
    values:
      layout: single
      author_profile: true
  # _portfolio
  - scope:
      path:   "_portfolio"
      type:   portfolio
    values:
      layout: single
      author_profile: true

# ----- SASS / CSS -----
sass:
  sass_dir: _sass
  style:    compressed

# ----- PLUGINS -----
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
